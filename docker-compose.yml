# Templates, not a ready-to-run stack - interface name and flags are
# host-specific, edit before use. Only one of dpi-lab-passive/dpi-lab-inline
# makes sense to run at a time (both want the host's network path);
# dpi-lab-ui is meant to run alongside whichever one you picked, sharing
# the same config/ and data/events.jsonl files. `restart: "no"` deliberately:
# this is an interactive lab tool, not a service that should silently
# respawn mid-experiment.
#
# --lockdown/throttle (pf-based) are macOS-only and will fail soft (log +
# continue) on this Linux image - see README.md's Docker section.
services:
  dpi-lab-passive:
    build: .
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    command: ["passive", "eth0", "--trace", "--inject", "--events-log", "/app/data/events.jsonl"] # replace eth0 with your real interface; --inject needed or matches never actually block (and never emit an event)
    restart: "no"

  dpi-lab-inline:
    build: .
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    command: ["inline", "--events-log", "/app/data/events.jsonl"]
    restart: "no"

  dpi-lab-ui:
    build: .
    container_name: dpi-lab-ui
    # No cap_add, no network_mode: host - unprivileged by design (see
    # events.rs's doc comment). No published ports either - Traefik reaches
    # it over the "internal" network directly by container port, same as
    # every other app in your apps/ stack; nothing else needs to publish
    # 8080 on the host at all.
    networks:
      - internal
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    command: ["ui", "--bind", "0.0.0.0:8080", "--config-dir", "/app/config", "--events-log", "/app/data/events.jsonl"]
    restart: "no"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=internal"
      - "traefik.http.services.dpi-lab-ui.loadbalancer.server.port=8080"
      - "traefik.http.routers.dpi-lab-ui.rule=Host(`dpi.hb.florianscholz.me`)"
      # TODO: confirm this matches the entrypoint name in your
      # traefik/config/traefik.yml static config (commonly "websecure").
      - "traefik.http.routers.dpi-lab-ui.entrypoints=websecure"
      - "traefik.http.routers.dpi-lab-ui.tls.certresolver=stepca"
      # This edits blocklists live - treat it like the rest of your
      # admin-tier services, not a public one.
      - "traefik.http.routers.dpi-lab-ui.middlewares=chain-admin@file"

networks:
  internal:
    external: true
