[package]
name = "dpi-lab"
version = "0.1.0"
edition = "2024"

[dependencies]
pnet = "0.35"
aho-corasick = "1"
md5 = "0.7"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
ctrlc = "3"
libc = "0.2"
ring = "0.17"

# --inline (genuine NFQUEUE-based inline enforcement, see src/inline.rs) is
# Linux-only - this dependency doesn't even get fetched/compiled on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
nfq = "0.2"
