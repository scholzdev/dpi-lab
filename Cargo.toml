[package]
name = "dpi-lab"
version = "0.1.0"
edition = "2024"

[dependencies]
pnet = "0.35"
aho-corasick = "1"
md5 = "0.7"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
ctrlc = "3"
libc = "0.2"
ring = "0.17"
x509-parser = "0.16"
hpack = "0.3.0"
log = "0.4.33"
env_logger = "0.11.11"
serde_json = "1.0.151"
tiny_http = "0.12.0"

# --inline (genuine NFQUEUE-based inline enforcement, see src/inline.rs) is
# Linux-only - this dependency doesn't even get fetched/compiled on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
nfq = "0.2"
