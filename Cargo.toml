[package]
name = "dpi-lab"
version = "0.1.0"
edition = "2024"

[lib]
name = "dpi_lab"
path = "src/lib.rs"

[dependencies]
pnet = "0.35"
aho-corasick = "1"
md5 = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
ctrlc = "3"
libc = "0.2"
ring = "0.17"
x509-parser = "0.18.1"
hpack = "0.3.0"
log = "0.4.33"
env_logger = "0.11.11"
serde_json = "1.0.151"
tiny_http = "0.12.0"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
rcgen = { version = "0.14.8", features = ["x509-parser"] }
webpki-roots = "1.0.9"

# --inline (genuine NFQUEUE-based inline enforcement, see src/inline.rs) is
# Linux-only - this dependency doesn't even get fetched/compiled on macOS.
[target.'cfg(target_os = "linux")'.dependencies]
nfq = "0.2"
